name: Fuzz and Security Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    name: Fuzz QML Backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            ninja-build \
            cmake \
            build-essential \
            pkg-config \
            libsqlite3-dev \
            zlib1g-dev \
            libboost-all-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-l10n-tools \
            qt6-tools-dev-tools \
            qt6-declarative-dev \
            qt6-svg-dev \
            qml6-module-qt-labs-platform \
            qml6-module-qt-labs-settings \
            libgl-dev \
            libqrencode-dev

      - name: Run QML-C++ static analysis linter
        run: |
          python3 test/fuzz/qml_security_lint.py qml

      - name: Configure (CMake)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_IPC=OFF \
            -DBUILD_FUZZ_TESTS=ON \
            -DBUILD_APP_TESTS=OFF

      - name: Build fuzz targets
        run: cmake --build build --parallel

      - name: Pull corpus from external repository
        env:
          EXTERNAL_REPO_PAT: ${{ secrets.EXTERNAL_REPO_PAT }}
        run: |
          mkdir -p build/test/fuzz/corpus
          if [ -n "${EXTERNAL_REPO_PAT}" ]; then
            git clone https://x-access-token:${EXTERNAL_REPO_PAT}@github.com/bitcoincore-dev/gui-qml-fuzzing.git fuzzing_repo || true
            if [ -d fuzzing_repo/corpus ]; then
              cp -r fuzzing_repo/corpus/* build/test/fuzz/corpus/ 2>/dev/null || true
            fi
          else
            echo "No EXTERNAL_REPO_PAT; starting with empty corpus."
          fi

      - name: Run fuzz targets
        env:
          ASAN_OPTIONS: detect_leaks=0
          LLVM_PROFILE_FILE: "build/test/fuzz/fuzz-%p.profraw"
        run: |
          for f in build/test/fuzz/fuzz_*; do
            echo "=== Running $f ==="
            "$f" build/test/fuzz/corpus -max_total_time=30 || true
          done

      - name: Push corpus and artifacts to external repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          EXTERNAL_REPO_PAT: ${{ secrets.EXTERNAL_REPO_PAT }}
        run: |
          if [ -z "${EXTERNAL_REPO_PAT}" ]; then
            echo "No EXTERNAL_REPO_PAT; skipping push."
            exit 0
          fi
          git config --global user.name "GitHub Actions CI Bot"
          git config --global user.email "actions@github.com"

          if [ ! -d fuzzing_repo ]; then
            git clone https://x-access-token:${EXTERNAL_REPO_PAT}@github.com/bitcoincore-dev/gui-qml-fuzzing.git fuzzing_repo
          fi

          mkdir -p fuzzing_repo/corpus fuzzing_repo/crashes
          rm -rf fuzzing_repo/corpus/* fuzzing_repo/crashes/*
          cp -r build/test/fuzz/corpus/* fuzzing_repo/corpus/ 2>/dev/null || true
          find build/test/fuzz -name 'crash-*' -exec cp {} fuzzing_repo/crashes/ \; 2>/dev/null || true

          cd fuzzing_repo
          git add .
          if git diff-index --quiet HEAD --; then
            echo "No changes in fuzzing artifacts to push."
          else
            git commit -m "Auto-update fuzzing corpus and artifacts from ${{ github.sha }}"
            git push origin main
          fi