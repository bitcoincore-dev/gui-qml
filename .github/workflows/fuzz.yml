name: Fuzz and Security Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  fuzz:
    name: Fuzz QML Backend
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            ninja-build \
            cmake \
            build-essential \
            pkg-config \
            libsqlite3-dev \
            zlib1g-dev \
            libboost-all-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-l10n-tools \
            qt6-tools-dev-tools \
            qt6-declarative-dev \
            qt6-svg-dev \
            qml6-module-qt-labs-platform \
            qml6-module-qt-labs-settings \
            libgl-dev \
            libqrencode-dev

      - name: Run QML-C++ static analysis linter
        run: |
          python3 test/fuzz/qml_security_lint.py qml

      - name: Configure (CMake)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DBUILD_FUZZ_TESTS=ON \
            -DBUILD_APP_TESTS=OFF

      - name: Build fuzz targets
        run: cmake --build build --parallel

      - name: Run fuzz targets
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          mkdir -p build/test/fuzz/corpus
          for f in build/test/fuzz/fuzz_*; do
            echo "=== Running $f ==="
            "$f" build/test/fuzz/corpus -max_total_time=30 || true
          done
