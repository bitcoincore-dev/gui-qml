name: Fuzz and Security Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      run_asan:
        description: 'Run AddressSanitizer + UBSan job'
        required: false
        default: true
        type: boolean
      run_ubsan:
        description: 'Run UBSan-only job'
        required: false
        default: true
        type: boolean
      run_tsan:
        description: 'Run ThreadSanitizer job'
        required: false
        default: true
        type: boolean
      deploy_artifacts:
        description: 'Push corpus/coverage/crashes to the external repository'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Prepare matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      - id: build
        run: |
          sanitizers=()
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            sanitizers+=("address,undefined" "undefined" "thread")
          else
            [ "${{ inputs.run_asan }}" = "true" ] && sanitizers+=("address,undefined")
            [ "${{ inputs.run_ubsan }}" = "true" ] && sanitizers+=("undefined")
            [ "${{ inputs.run_tsan }}" = "true" ] && sanitizers+=("thread")
          fi
          # Always have at least one entry
          if [ ${#sanitizers[@]} -eq 0 ]; then sanitizers+=("address,undefined"); fi
          json=$(printf '%s\n' "${sanitizers[@]}" | jq -R . | jq -s -c .)
          echo "matrix={\"sanitizer\":$json}" >> "$GITHUB_OUTPUT"

  fuzz:
    name: Fuzz QML Backend (${{ matrix.sanitizer }})
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 60
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.sanitizer }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            jq \
            ninja-build \
            cmake \
            build-essential \
            pkg-config \
            libsqlite3-dev \
            zlib1g-dev \
            libboost-all-dev \
            qt6-base-dev \
            qt6-base-dev-tools \
            qt6-tools-dev \
            qt6-l10n-tools \
            qt6-tools-dev-tools \
            qt6-declarative-dev \
            qt6-svg-dev \
            qml6-module-qt-labs-platform \
            qml6-module-qt-labs-settings \
            libgl-dev \
            libqrencode-dev

      - name: Run QML-C++ static analysis linter
        run: |
          python3 test/fuzz/qml_security_lint.py qml

      - name: Configure (CMake)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DENABLE_IPC=OFF \
            -DBUILD_FUZZ_TESTS=ON \
            -DBUILD_APP_TESTS=OFF \
            -DFUZZ_SANITIZERS="fuzzer,${{ matrix.sanitizer }}"

      - name: Build fuzz targets
        run: cmake --build build --parallel

      - name: Pull corpus from external repository
        env:
          EXTERNAL_REPO_PAT: ${{ secrets.EXTERNAL_REPO_PAT }}
        run: |
          mkdir -p build/test/fuzz/corpus
          if [ -n "${EXTERNAL_REPO_PAT}" ]; then
            git clone https://x-access-token:${EXTERNAL_REPO_PAT}@github.com/bitcoincore-dev/gui-qml-fuzzing.git fuzzing_repo || true
            if [ -d fuzzing_repo/corpus ]; then
              cp -r fuzzing_repo/corpus/* build/test/fuzz/corpus/ 2>/dev/null || true
            fi
          else
            echo "No EXTERNAL_REPO_PAT; starting with empty corpus."
          fi

      - name: Run fuzz targets
        env:
          ASAN_OPTIONS: detect_leaks=0
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/test/sanitizer_suppressions/tsan
          LLVM_PROFILE_FILE: "build/test/fuzz/fuzz-%p.profraw"
        run: |
          for f in build/test/fuzz/fuzz_*; do
            echo "=== Running $f ==="
            "$f" build/test/fuzz/corpus -max_total_time=30 || true
          done

      - name: Process coverage data
        if: matrix.sanitizer == 'address,undefined'
        run: |
          mkdir -p build/coverage_report
          if ls build/test/fuzz/*.profraw >/dev/null 2>&1; then
            llvm-profdata merge -sparse build/test/fuzz/*.profraw -o build/test/fuzz/fuzz.profdata
            llvm-cov show build/test/fuzz/fuzz_bitcoin_uri \
              -instr-profile=build/test/fuzz/fuzz.profdata \
              -format=html -output-dir=build/coverage_report \
              -ignore-filename-regex="/usr/|tests/" 2>/dev/null || true
            llvm-cov export build/test/fuzz/fuzz_bitcoin_uri \
              -instr-profile=build/test/fuzz/fuzz.profdata \
              -format=lcov \
              -ignore-filename-regex="/usr/|tests/" > build/coverage.lcov 2>/dev/null || true
          fi

      - name: Push corpus and artifacts to external repository
        if: matrix.sanitizer == 'address,undefined' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.deploy_artifacts == true))
        env:
          EXTERNAL_REPO_PAT: ${{ secrets.EXTERNAL_REPO_PAT }}
        run: |
          if [ -z "${EXTERNAL_REPO_PAT}" ]; then
            echo "No EXTERNAL_REPO_PAT; skipping push."
            exit 0
          fi
          git config --global user.name "GitHub Actions CI Bot"
          git config --global user.email "actions@github.com"

          if [ ! -d fuzzing_repo ]; then
            if ! git clone https://x-access-token:${EXTERNAL_REPO_PAT}@github.com/bitcoincore-dev/gui-qml-fuzzing.git fuzzing_repo 2>/dev/null; then
              echo "External fuzzing repository not found or inaccessible; skipping push."
              exit 0
            fi
          fi

          mkdir -p fuzzing_repo/corpus fuzzing_repo/crashes fuzzing_repo/coverage
          rm -rf fuzzing_repo/corpus/* fuzzing_repo/crashes/* fuzzing_repo/coverage/*
          cp -r build/test/fuzz/corpus/* fuzzing_repo/corpus/ 2>/dev/null || true
          find build/test/fuzz -name 'crash-*' -exec cp {} fuzzing_repo/crashes/ \; 2>/dev/null || true
          cp -r build/coverage_report/* fuzzing_repo/coverage/ 2>/dev/null || true
          cp build/coverage.lcov fuzzing_repo/coverage.lcov 2>/dev/null || true
          cp build/coverage_report/index.html fuzzing_repo/index.html 2>/dev/null || true

          cd fuzzing_repo
          git add .
          if git diff-index --quiet HEAD --; then
            echo "No changes in fuzzing artifacts to push."
          else
            git commit -m "Auto-update fuzzing corpus and artifacts from ${{ github.sha }}"
            git push origin master
          fi